spring.application.name=prestamos
server.port=8081

spring.thymeleaf.cache=false

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

spring.datasource.url=jdbc:mysql://localhost:3306/prestamos

spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.mvc.hiddenmethod.filter.enabled=true

jwt.secret=MiClaveSecretaParaJWT2026ConAlMenos64CaracteresDeLongitudMinimaParaSeguridad
# 24 horas = 86400000 ms (antes estaba en 10 minutos = 600000 ms)
jwt.expiration=86400000
